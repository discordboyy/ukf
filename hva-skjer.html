<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hva Skjer Ukrainsk Kunstforening</title>
  <link rel="stylesheet" href="src/style/style.css" />
  <link rel="stylesheet" href="src/style/hva-skjer.css">
  <link rel="icon" type="image/svg" href="src/assets/32x32_icon.svg" sizes="32x32">

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
  <script src="src/js/main.js" defer></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Funnel+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="header"></div>

    <div class="frame-168">
        <div class="frame-157 scroll-animate">
            <img class="polygon-7" src="src/assets/hva-skjer/Polygon 6.svg" />
            <img class="polygon-6" src="src/assets/hva-skjer/Polygon 6.svg" />
            <div class="hva-skjer">HVA SKJER</div>
        </div>
        <a href="#upcoming-events" class="frame-159">
            <div class="alle-planlagte-aktiviteter">Alle planlagte aktiviteter /</div>
            <div class="frame-158">
            <div class="calendar">calendar</div>
            <img class="frame-160" src="src/assets/hva-skjer/Polygon 2 (2).svg" />
            </div>
        </a>
    </div>

    <section class="upcoming-events-section" id="upcoming-events">
        <div id="events-container"></div>
    </section>

    <div id="contact-root"></div>
    <div id="about-root"></div>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const scrollBlocks = document.querySelectorAll(".scroll-animate");

        function checkScrollBlocks() {
            scrollBlocks.forEach(block => {
                const rect = block.getBoundingClientRect();
                if (rect.top < window.innerHeight * 0.75) {
                    block.classList.add("show");
                }
            });
        }

        window.addEventListener("scroll", checkScrollBlocks);
        checkScrollBlocks(); // Проверка при загрузке страницы
    });
    </script>

</body>
</html>
